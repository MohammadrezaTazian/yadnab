name: education_app
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  dio: ^5.7.0
  dartz: ^0.10.1
  shared_preferences: ^2.3.4
  go_router: ^18.0.2
  intl: ^0.20.1
  get_it: ^9.3.0
  provider: ^6.1.2
  flutter_svg: ^2.0.16
  pinput: ^7.0.0
  image_picker: ^1.1.2
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_math_fork: ^0.7.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  flutter_gen_runner: ^5.15.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/logos/
    - assets/config.json

  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir/Vazir-Regular.ttf
        - asset: assets/fonts/Vazir/Vazir-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazir/Vazir-Light.ttf
          weight: 300

l10n:
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart
  output-class: AppLocalizations




