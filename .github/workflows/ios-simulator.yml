name: Build Yadnab iOS Simulator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-simulator:
    name: Build iOS Simulator App
    runs-on: macos-15
    timeout-minutes: 45

    defaults:
      run:
        working-directory: education_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Check Xcode
        run: |
          xcode-select -p
          xcodebuild -version
          flutter --version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate missing iOS platform files
        run: flutter create --platforms=ios --project-name education_app --org com.example .

      - name: Configure production API for Appetize
        run: |
          python3 - <<'PY'
          import json

          path = "assets/config.json"

          with open(path, "r", encoding="utf-8") as file:
              config = json.load(file)

          config["apiBaseUrl"] = "https://api.yadnab.ir/api"

          with open(path, "w", encoding="utf-8") as file:
              json.dump(config, file, indent=2)
              file.write("\n")
          PY

      - name: Build iOS Simulator app
        run: flutter build ios --simulator --debug --no-codesign

      - name: Package simulator app
        run: |
          test -d build/ios/iphonesimulator/Runner.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app \
            Runner-simulator.zip

      - name: Upload to Appetize
        uses: appetizeio/github-action-appetize@v1.1.0
        with:
          apiToken: ${{ secrets.APPETIZE_API_TOKEN }}
          appFile: education_app/Runner-simulator.zip
          platform: ios
          note: Yadnab iOS Simulator

      - name: Upload simulator app artifact
        uses: actions/upload-artifact@v4
        with:
          name: yadnab-ios-simulator
          path: education_app/Runner-simulator.zip
          if-no-files-found: error
          retention-days: 7
